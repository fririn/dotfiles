# foot config, ported from ../kitty/kitty.conf

[main]
font=FantasqueSansM Nerd Font Mono:size=13
# kitty: bold_font/italic_font/bold_italic_font auto -> foot derives these
# automatically from the family above when left unset.

# kitty: window_padding_width 3
pad=3x3

[scrollback]
# kitty: scrollback_lines 100000
lines=100000

[bell]
# kitty: enable_audio_bell no
urgent=no
notify=no
visual=no

[colors-dark]
# kitty: foreground #dddddd / background #000000
foreground=dddddd
background=000000
# kitty: selection_foreground none / selection_background none
# (kitty "none" = reverse video; foot does this by default when unset)

# kitty: cursor #dddddd (foot needs both the under-cursor text color and
# the cursor color itself)
cursor=000000 dddddd

# kitty: background_opacity 1 / dynamic_background_opacity 1
alpha=1.0
