# Docs:      https://mangowm.github.io/docs 
# Validate:  mango -c ~/.config/mango/config.conf -p
# Reload:    SUPER+SHIFT+R 

##################################################################################
# VARIABLES
##################################################################################
var=term,kitty
var=scripts,$HOME/.config/mango/scripts
var=hyprscripts,$HOME/.config/hypr/scripts
var=rofidir,$HOME/.config/rofi
# Launch apps in their own systemd scope (under app.slice) so systemd-oomd kills the
# offending app instead of the session scope, which holds mango itself.
var=run,systemd-run --user --scope --slice=app.slice --collect --quiet --

##################################################################################
# ENVIRONMENT
##################################################################################
# Note: mango resets these on every config reload, and sets XDG_CURRENT_DESKTOP=mango
env=EDITOR,nvim

# Toolkit backends
env=GDK_BACKEND,wayland,x11,*
env=QT_QPA_PLATFORM,wayland;xcb
env=CLUTTER_BACKEND,wayland

# Input method (fcitx5)
env=QT_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx

env=XDG_SESSION_TYPE,wayland

# Qt
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_QUICK_CONTROLS_STYLE,org.hyprland.style

# Scaling (keep in sync with the monitor scale)
env=GDK_SCALE,1
env=QT_SCALE_FACTOR,1

# Firefox / Electron
env=MOZ_ENABLE_WAYLAND,1
env=ELECTRON_OZONE_PLATFORM_HINT,auto

env=XCURSOR_THEME,Adwaita
env=XCURSOR_SIZE,48

##################################################################################
# AUTOSTART
##################################################################################
exec_once=$hyprscripts/Polkit.sh
exec_once=fcitx5
exec_once=flameshot

exec_once=wl-paste --type text --watch cliphist -max-items 99999999 store
exec_once=wl-paste --type image --watch cliphist -max-items 99999999 store

exec_once=noctalia

exec_once=$scripts/autostart.sh

##################################################################################
# DISPLAY
##################################################################################
# LG C5 42"
monitor_rule=name:^HDMI-A-1$,width:3840,height:2160,refresh:120,x:1440,y:500,scale:1
# Samsung LS32AG55x, rotated 90°
monitor_rule=name:^DP-2$,width:2560,height:1440,refresh:165,x:0,y:0,scale:1,rr:1
# monitor_rule=name:^eDP-1$,width:1920,height:1200,refresh:120,x:0,y:1000,scale:1
# Any other output stays off.
# monitor_rule=name:.*,disable:1

tag_rule=id:*,layout_name:dwindle
tag_rule=id:1,monitor_name:HDMI-A-1,no_hide:1,layout_name:dwindle
tag_rule=id:2,monitor_name:HDMI-A-1,no_hide:1,layout_name:dwindle
tag_rule=id:3,monitor_name:HDMI-A-1,no_hide:1,layout_name:dwindle
tag_rule=id:4,monitor_name:HDMI-A-1,no_hide:1,layout_name:dwindle
tag_rule=id:5,monitor_name:HDMI-A-1,no_hide:1,layout_name:dwindle
tag_rule=id:6,monitor_name:HDMI-A-1,no_hide:1,layout_name:dwindle
tag_rule=id:7,monitor_name:HDMI-A-1,no_hide:1,layout_name:dwindle
tag_rule=id:8,monitor_name:HDMI-A-1,no_hide:1,layout_name:dwindle
tag_rule=id:1,monitor_name:DP-2,no_hide:1,layout_name:dwindle
tag_rule=id:2,monitor_name:DP-2,no_hide:1,layout_name:dwindle

##################################################################################
# DECORATIONS
##################################################################################
border_px=2
border_radius=0
gap_inner_horizontal=3
gap_inner_vertical=3
gap_outer_horizontal=5
gap_outer_vertical=5
smart_gaps=1

focus_color=0xCCCCCC55
border_color=0x00000000

#scratchpad_color=0xCCCCCCAA

focused_opacity=1.0
unfocused_opacity=1.0
dim_enable=0

shadows=0
layer_shadows=0

blur=1
blur_layer=1
blur_optimized=1
blur_params_radius=5
blur_params_num_passes=3

##################################################################################
# ANIMATIONS
##################################################################################
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
zoom_initial_ratio=0.8
zoom_end_ratio=0.9
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
animation_duration_open=400
animation_duration_close=400
animation_duration_move=400
animation_duration_tag=400
animation_duration_focus=0
animation_curve_open=0,1,0,1

animation_curve_close=0,0.75,0.15,1
animation_curve_move=0,0.75,0.15,1
animation_curve_tag=0,0.75,0.15,1

##################################################################################
# LAYOUTS
##################################################################################
dwindle_preserve_split=1
dwindle_smart_split=0

# master
new_is_master=1
default_master_factor=0.5

##################################################################################
# SPECIAL TAG (F11) + SCRATCHPAD (F12)
##################################################################################
# dwindle special_scale_factor=0.97 on a 3840x2160 screen ≈ these margins.
special_gap_outer_horizontal=58
special_gap_outer_vertical=32
special_gap_inner_horizontal=3
special_gap_inner_vertical=3
special_dim=0.2

# Default size for scratchpads without an explicit size in their rule.
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

##################################################################################
# INPUT
##################################################################################
xkb_rules_layout=us,ru
xkb_rules_options=grp:win_space_toggle
xkb_rules_model=pc105
repeat_delay=250
repeat_rate=50

# follow_mouse = 1
sloppy_focus=1
# cursor:no_warps = true
warp_cursor=0
focus_on_activate=0

##################################################################################
# MISC
##################################################################################
cursor_theme=Adwaita
cursor_size=48
# xwayland:force_zero_scaling
xwayland_ignore_scale=1
# windowrule idle_inhibit fullscreen
idle_inhibit_when_fullscreen=1

##################################################################################
# KEYBINDS
##################################################################################
# Held binds repeat at the keyboard repeat rate, so volume/brightness need no flag.

# General
bind=CTRL+ALT,Delete,quit
bind=SUPER,C,killclient
bind=SUPER,escape,spawn,noctalia msg session lock
bind=SUPER+SHIFT,P,toggleglobal
bind=SUPER+SHIFT,R,reload_config

# Tiling
bind=SUPER,F,togglefloating
bind=SUPER,M,togglefullscreen
bind=SUPER+SHIFT,M,togglemaximizescreen

# Cycle windows 
bind=ALT,Tab,focusstack,next

# Hot keys 
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 2%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86Sleep,spawn,systemctl suspend
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioStop,spawn,playerctl stop

# Screenshots
bind=SHIFT,Print,spawn,flameshot gui
bind=NONE,Print,spawn_shell,grimblast --freeze save area - | tee ~/Pictures/Screenshots/Clipboard/$(date +%Y%m%d-%H:%M:%S).png | swappy -f -
#bind=NONE,Print,spawn,$scripts/screenshot.sh

# Move windows / focus (hjkl)
bind=SUPER+CTRL,h,move_client,left
bind=SUPER+CTRL,l,move_client,right
bind=SUPER+CTRL,k,move_client,up
bind=SUPER+CTRL,j,move_client,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
# bind=SUPER+ALT,h,exchange_client,left
# bind=SUPER+ALT,l,exchange_client,right
# bind=SUPER+ALT,k,exchange_client,up
# bind=SUPER+ALT,j,exchange_client,down

# F12 / ALT+x: Launches kitty+tmux the first time, then shows/hides that one window.
# Wrapped in a script so fullscreen (SUPER+M) survives hide/show.
#bind=NONE,F12,toggle_named_scratchpad,kitty-scratch,none,$run $term --class kitty-scratch -e tmux
#bind=ALT,x,toggle_named_scratchpad,kitty-scratch,none,$run $term --class kitty-scratch -e tmux
bind=NONE,F12,spawn,$scripts/ScratchTerm.sh $term
bind=ALT,x,spawn,$scripts/ScratchTerm.sh $term

# F11 / ALT+z: special tag. A tiled overlay over the current tag.
bind=NONE,F11,toggle_special_tag
bind=ALT,z,toggle_special_tag
# Moves the focused window into the special tag, or back out if it's already there.
bind=SHIFT,F11,tag_special_tag
bind=SHIFT+ALT,z,tag_special_tag

# Tags 1-8: key codes (layout independent)    code:10 = key 1
bind=SUPER,code:10,view,1
bind=SUPER,code:11,view,2
bind=SUPER,code:12,view,3
bind=SUPER,code:13,view,4
bind=SUPER,code:14,view,5
bind=SUPER,code:15,view,6
bind=SUPER,code:16,view,7
bind=SUPER,code:17,view,8

bind=SUPER+SHIFT,code:10,tag,1
bind=SUPER+SHIFT,code:11,tag,2
bind=SUPER+SHIFT,code:12,tag,3
bind=SUPER+SHIFT,code:13,tag,4
bind=SUPER+SHIFT,code:14,tag,5
bind=SUPER+SHIFT,code:15,tag,6
bind=SUPER+SHIFT,code:16,tag,7
bind=SUPER+SHIFT,code:17,tag,8

bind=SUPER+CTRL,code:10,tagsilent,1
bind=SUPER+CTRL,code:11,tagsilent,2
bind=SUPER+CTRL,code:12,tagsilent,3
bind=SUPER+CTRL,code:13,tagsilent,4
bind=SUPER+CTRL,code:14,tagsilent,5
bind=SUPER+CTRL,code:15,tagsilent,6
bind=SUPER+CTRL,code:16,tagsilent,7
bind=SUPER+CTRL,code:17,tagsilent,8

# Tags 1-8: the qwe/asd/zx grid
bind=SUPER,Q,view,1
bind=SUPER,W,view,2
bind=SUPER,E,view,3
bind=SUPER,A,view,4
bind=SUPER,S,view,5
bind=SUPER,D,view,6
bind=SUPER,Z,view,7
bind=SUPER,X,view,8

bind=SUPER+SHIFT,Q,tag,1
bind=SUPER+SHIFT,W,tag,2
bind=SUPER+SHIFT,E,tag,3
bind=SUPER+SHIFT,A,tag,4
bind=SUPER+SHIFT,S,tag,5
bind=SUPER+SHIFT,D,tag,6
bind=SUPER+SHIFT,Z,tag,7
bind=SUPER+SHIFT,X,tag,8

# Move window to the previous/next tag
# bind=SUPER+SHIFT,bracketleft,tagtoleft
# bind=SUPER+SHIFT,bracketright,tagtoright

# Next/previous non-empty tag 
# bind=SUPER,period,viewtoright_have_client
# bind=SUPER,comma,viewtoleft_have_client

# Move/resize with mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

bind=SUPER,I,spawn,noctalia msg bar-toggle

# Apps
bind=ALT,space,spawn_shell,pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window -theme "$rofidir"/themes/launcher.rasi -drun-display-format "{name}" -display-drun "" -run-command "$run {cmd}"
# floating terminal at a random position (mango port of the hyprctl script)
bind=SUPER,Return,spawn,$scripts/RandomTerminal.sh $term

# Features / extras
bind=SUPER,V,spawn,~/work/custom/ssh-menu/ssh_menu.sh
bind=SUPER+ALT,D,spawn,$hyprscripts/RofiEmoji.sh
bind=SUPER+ALT,V,spawn,$hyprscripts/ClipManager.sh
bind=SUPER,R,spawn,noctalia msg config-reload

##################################################################################
# WINDOW RULES
##################################################################################
window_rule=is_named_scratchpad:1,no_border:1,width:0.97,height:0.97,app_id:^kitty-scratch$
# SUPER+Return random-position terminal (position is set by the script)
window_rule=is_floating:1,width:0.4,height:0.45,app_id:^kitty-random$

window_rule=is_floating:1,width:0.7,height:0.7,app_id:^(wihotspot(-gui)?|[Bb]aobab|org.gnome.[Bb]aobab|gnome-disks|file-roller|org.gnome.FileRoller|nm-applet|nm-connection-editor|blueman-manager)$
window_rule=is_floating:1,width:0.7,height:0.7,app_id:^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol|qt5ct|qt6ct|[Yy]ad|org.kde.polkit-kde-authentication-agent-1|[Rr]ofi)$
window_rule=is_floating:1,width:0.7,height:0.7,app_id:xdg-desktop-portal-gtk
window_rule=is_floating:1,width:0.7,height:0.7,title:^(ROG Control)$
window_rule=is_floating:1,width:0.7,height:0.7,title:Kvantum Manager

# viewer (system monitor, document viewer, image viewer)
window_rule=is_floating:1,app_id:^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter|evince|eog|org.gnome.Loupe)$

# Float
window_rule=is_floating:1,app_id:([Zz]oom|onedriver|onedriver-launcher)$
window_rule=is_floating:1,app_id:org.gnome.Calculator,title:Calculator
window_rule=is_floating:1,app_id:^(mpv|com.github.rafostar.Clapper)$
window_rule=is_floating:1,app_id:^([Qq]alculate-gtk)$
window_rule=is_floating:1,is_global:1,title:^(Picture-in-Picture)$

# Float popups and dialogs
window_rule=is_floating:1,title:^(Authentication Required)$
window_rule=is_floating:1,width:0.7,height:0.6,title:^(Add Folder to Workspace)$
window_rule=is_floating:1,width:0.7,height:0.6,title:^(Save As)$
window_rule=is_floating:1,width:0.4,height:0.6,title:^(floating)$
window_rule=is_floating:1,width:0.4,height:0.6,title:^(flameshot)$
window_rule=is_floating:1,width:0.7,height:0.6,title:Open Files

# Size (applies when floating)
window_rule=width:0.6,height:0.7,app_id:^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap|[Ff]erdium)$

# games: no blur, float
window_rule=no_blur:1,is_floating:1,app_id:^(gamescope|steam_app_\d+)$

##################################################################################
# LAYER RULES
##################################################################################
layer_rule=no_animation:1,no_blur:1,layer_name:selection
layer_rule=no_animation:1,no_blur:1,layer_name:slurp
layer_rule=no_animation:1,no_blur:1,layer_name:hyprpicker
