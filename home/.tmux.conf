# vim style tmux config

set -g allow-passthrough on

# Easy config reload
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# vi is good
setw -g mode-keys vi
set -g mouse on

# Pane navigation — Alt/Option+hjkl (no prefix needed)
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Windows
bind-key -n C-t   new-window    -c '#{pane_current_path}'
bind-key -n M-t   new-window    -c '#{pane_current_path}'
bind-key -n M-T   run-shell -b '~/.local/bin/tmux-clone-ssh window #{pane_pid} #{q:pane_tty} #{q:pane_current_path}'
bind-key -n C-M-h previous-window
bind-key -n C-M-l next-window

# Jump to windows by number; works when the terminal sends Ctrl+number to tmux.
bind-key -n C-0 select-window -t :=0
bind-key -n C-1 select-window -t :=1
bind-key -n C-2 select-window -t :=2
bind-key -n C-3 select-window -t :=3
bind-key -n C-4 select-window -t :=4
bind-key -n C-5 select-window -t :=5
bind-key -n C-6 select-window -t :=6
bind-key -n C-7 select-window -t :=7
bind-key -n C-8 select-window -t :=8
bind-key -n C-9 select-window -t :=9

# Splits
bind-key -n C-M-k split-window -h -c '#{pane_current_path}'
bind-key -n C-M-j split-window -v -c '#{pane_current_path}'
bind-key -n C-M-K run-shell -b '~/.local/bin/tmux-clone-ssh split -h #{pane_pid} #{q:pane_tty} #{q:pane_current_path}'
bind-key -n C-M-J run-shell -b '~/.local/bin/tmux-clone-ssh split -v #{pane_pid} #{q:pane_tty} #{q:pane_current_path}'

# Pane resize — Alt+HJKL (Shift variants)
bind-key -n M-H resize-pane -L 5
bind-key -n M-J resize-pane -D 5
bind-key -n M-K resize-pane -U 5
bind-key -n M-L resize-pane -R 5

# Zoom/maximise pane
bind-key -n M-m resize-pane -Z

# Rotate pane layout
bind-key -n C-M-o rotate-window

set-window-option -g other-pane-height 25
#set-option -g pane-border-style fg=colour237
set-window-option -g other-pane-width 80
set-window-option -g display-panes-time 1500
set-window-option -g window-status-current-style fg=magenta

set-option -g pane-active-border-style fg=yellow
set-option -g pane-border-style fg=red
set-option -g history-limit 1000000

# Address vim mode switching delay
set -s escape-time 0

# Increase tmux messages display duration
set -g display-time 4000

# ── Terminal / colours ────────────────────────────────────────────────────────
# tmux-256color enables full colour support; the overrides add true-colour
# (Tc) and the undercurl passthrough needed by Neovim on both Ghostty and kitty
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm*:Tc"
set -ga terminal-overrides ",ghostty:Tc"
# Undercurl support (Neovim diagnostics etc.)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ── Misc ──────────────────────────────────────────────────────────────────────
setw -g aggressive-resize on
# tmux colors cheetsheet https://i.sstatic.net/e63et.png
#set -g window-style 'fg=colour247,bg=colour232'
#set -g window-active-style 'fg=colour250,bg=black'
#set -g window-status-current-format "#[fg=black,bold bg=default]|#[fg=white bg=cyan]#W#[fg=black,bold bg=default]|"
#set -g window-status-current-format "#[fg=black,bold bg=default]|#[fg=colour135 bg=black]#W#[fg=black,bold bg=default]|"
#set -g status-style bg=default
set -g status-justify left

# Status bar
set-option -g status-interval 1
set-option -g status-style bg=black
set-option -g status-style fg=white
set -g status-left '#[fg=green]#H| #[default]'
#set -g status-left '#[fg=colour135,bg=default] #H || #[default]'
#set -g status-right "#[fg=white] #[bg=black] %b %d %Y %l:%M %p"
set -g status-right '%b %d, %A, %l:%M:%S %p#[default]'
#set -g status-right "#(echo #{pane_current_path} | sed 's#$HOME#~#g')"
