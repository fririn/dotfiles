source = $HOME/.config/hypr/env.conf

##################################################################################
# DEFAULTS #######################################################################
##################################################################################
env = EDITOR,nvim 
$edit=${EDITOR:-nano}
$term = kitty 
$files = nautilus
$search = "https://www.google.com/search?q={}"


##################################################################################
# AUTOSTART ######################################################################
##################################################################################

$scriptsDir = $HOME/.config/hypr/scripts
$wallDIR=$HOME/Pictures/wallpapers
$lock = $scriptsDir/LockScreen.sh

# Startup
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Polkit (Polkit Gnome / KDE)
exec-once = $scriptsDir/Polkit.sh

# for japanese input
exec-once = fcitx5

# big cursor
exec-once = hyprctl setcursor pop 48

#clipboard manager
exec-once = wl-paste --type text --watch cliphist -max-items 99999999 store 
exec-once = wl-paste --type image --watch cliphist -max-items 99999999 store 

# Startup apps
exec-once = hypridle
exec-once = ~/.config/hypr/scripts/monitor-listener.sh
exec-once = swaync
exec-once = qs -c noctalia-shell
#exec-once = nm-applet --indicator
#exec-once = blueman-applet
#exec-once = waybar

exec-once = [workspace special:terminal silent] $term -e tmux 
exec-once = [workspace 1 silent] zen-browser --no-remote -P "work"
exec-once = [workspace 2 silent] slack
exec-once = [workspace 4 silent] zen-browser --no-remote -P "Default (release)"
exec-once = [workspace 5 silent] telegram-desktop
exec-once = [workspace 7 silent] anki
#exec-once = [workspace 9 silent] steam


##################################################################################
# DISPLAY ########################################################################
##################################################################################
# Monitor definitions
monitor = DP-3, 2560x1440@165, 0x0, 1
monitor = eDP-1, 1920x1200@60, 2560x1100, 1
#monitor = ,disable  # disable any unknown monitors

# Lid switch
# bindl = , switch:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
# bindl = , switch:on:Lid Switch, exec, hyprctl dispatch dpms off
# bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on
# bindl = , switch:on:Lid Switch, exec, systemctl suspend
#bindl=,switch:on:Lid Switch, exec, hyprlock --grace 0 && systemctl suspend

# Run layout script on startup
exec-once = ~/.config/hypr/scripts/monitor-setup.sh

##################################################################################
# DECORATIONS ####################################################################
##################################################################################
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

animations {
    enabled = true
    bezier = myBezier, 0, 1, 0, 1

    animation = windows, 1, 4, myBezier, popin 80%
    animation = windowsOut, 1, 4, default, popin 90%

    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
    animation = specialWorkspace, 1, 4, default, slidevert
  #animation = specialWorkspace, 1, 4, default, slidevertfade 80%
}

#for libadwaita gtk4 apps you can use this command:
#exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

#for gtk3 apps you need to install adw-gtk3 theme (in arch linux sudo pacman -S adw-gtk-theme)
#exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3"   # for GTK3 apps

#for kde apps you need to install: sudo pacman -S qt5ct qt6ct kvantum kvantum breeze-icons   
#you will need to set dark theme for qt apps from kde more difficult thans with gnome :D:
env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps# Theme


general {
  layout = dwindle
  border_size = 2
  gaps_in = 5
  gaps_out = 10
  #gaps_out = 0,17,17,17
  
  col.active_border = rgba(CCCCCCCC)
  col.inactive_border = rgba(00000050)
}

# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

decoration {
  rounding = 0
         
  active_opacity = 1
  inactive_opacity = 1
  fullscreen_opacity = 1

  dim_inactive = false
  dim_strength = 0.4
  dim_special = 0.3

  shadow {
    enabled = false
    range = 8
    render_power = 0

    #color =  $background
    color =  rgba(00000055)
    #color_inactive = $color10
  }

  blur {
      enabled = false
      size = 6
      passes = 3
      contrast = 0.95
      vibrancy = 0.08
  }

}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}


##################################################################################
# SETTINGS #######################################################################
##################################################################################

dwindle {
  preserve_split = true
  #smart_split = true
  special_scale_factor = 0.97
}

master {
  new_status = master
  new_on_top = 1
  mfact = 0.5
}

general {
  resize_on_border = false
  layout = dwindle
}
input {
    kb_layout = us,ru
    kb_options = grp:win_space_toggle
    kb_model = pc105

    repeat_delay = 250
    repeat_rate = 50
    special_fallthrough = true

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = false
        disable_while_typing = false
        scroll_factor = 0.4
    }
}

device {
    name = syna8017:00-06cb:ceb2-touchpad
    sensitivity = +0.25
    accel_profile = "adaptive"
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  enable_swallow = off
  swallow_regex = ^(kitty)$
  focus_on_activate = false
  initial_workspace_tracking = 0
  middle_click_paste = true
  enable_anr_dialog = true    # Application not Responding (ANR)
  anr_missed_pings = 15       # ANR Threshold default 1 is too low
}

#opengl {
#  nvidia_anti_flicker = true
#}

binds {
  workspace_back_and_forth = false
  allow_workspace_cycles = true
  pass_mouse_when_bound = false
  workspace_center_on = 1
}

#Could help when scaling and not pixelating
xwayland {
  enabled = true
  force_zero_scaling = true
}

render {
  direct_scanout = 0
  # cm_auto_hdr = 1
}

cursor {
  sync_gsettings_theme = true
  no_hardware_cursors = 2 # change to 1 if want to disable
  enable_hyprcursor = true
  no_warps = true 
}


##################################################################################
# KEYBINDS #######################################################################
##################################################################################
$mainMod = SUPER

# GENERAL 
bind = CTRL ALT, Delete, exec, hyprctl dispatch exit 0 # exit Hyprland
bind = ALT SHIFT, C, killactive, # close active (not kill)
# bind = $mainMod SHIFT, C, exec, $scriptsDir/KillActiveProcess.sh # Kill active process
bind = $mainMod, escape, exec, hyprlock # screen lock
bind = $mainMod SHIFT, P, pin

# TILING
bind = $mainMod, F, togglefloating, #Float Mode
bind = $mainMod, M, fullscreen # whole full screen
bind = $mainMod SHIFT, M, fullscreen, 1 # fake full screen

 # Cycle windows if floating bring to top
bind = ALT, tab, cyclenext
bind = ALT, tab, bringactivetotop  

# Special Keys / Hot Keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 2%+ # up
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%- # down
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # mute
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle # mute mic
bindl = ,  XF86Sleep, exec, systemctl suspend  # sleep button 

bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# media controls using keyboards
bindl = , XF86AudioPlayPause, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop

# bind = , Print, exec, flameshot gui
bind = , Print, exec,grimblast --freeze save area - | tee ~/Pictures/Screenshots/Clipboard/$(date +%Y%m%d-%H:%M:%S).png | swappy -f -;

# Move windows
bind = $mainMod CTRL, h, movewindow, l
bind = $mainMod CTRL, l, movewindow, r
bind = $mainMod CTRL, k, movewindow, u
bind = $mainMod CTRL, j, movewindow, d

# Swap windows
# bind = $mainMod ALT, h, swapwindow, l
# bind = $mainMod ALT, l, swapwindow, r
# bind = $mainMod ALT, k, swapwindow, u
# bind = $mainMod ALT, j, swapwindow, d

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Special workspace
bind = ,F12, togglespecialworkspace, terminal
bind = ALT, x, togglespecialworkspace, terminal
bind = SHIFT, F12, movetoworkspace, special:terminal
bind = SHIFT ALT, x, movetoworkspace, special:terminal

# The following mappings use the key codes to better support various keyboard layouts
# 1 is code:10, 2 is code 11, etc
# Switch workspaces with mainMod + [0-9] 
bind = $mainMod, code:10, workspace, 1 # NOTE: code:10 = key 1
bind = $mainMod, code:11, workspace, 2 # NOTE: code:11 = key 2
bind = $mainMod, code:12, workspace, 3 # NOTE: code:12 = key 3
bind = $mainMod, code:13, workspace, 4 # NOTE: code:13 = key 4
bind = $mainMod, code:14, workspace, 5 # NOTE: code:14 = key 5
bind = $mainMod, code:15, workspace, 6 # NOTE: code:15 = key 6
bind = $mainMod, code:16, workspace, 7 # NOTE: code:16 = key 7
bind = $mainMod, code:17, workspace, 8 # NOTE: code:17 = key 8
bind = $mainMod, code:18, workspace, 9 # NOTE: code:18 = key 9
bind = $mainMod, code:19, workspace, 10 # NOTE: code:19 = key 0

# Move active window and follow to workspace mainMod + SHIFT [0-9]
bind = $mainMod SHIFT, code:10, movetoworkspace, 1 # NOTE: code:10 = key 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2 # NOTE: code:11 = key 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3 # NOTE: code:12 = key 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4 # NOTE: code:13 = key 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5 # NOTE: code:14 = key 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6 # NOTE: code:15 = key 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7 # NOTE: code:16 = key 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8 # NOTE: code:17 = key 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9 # NOTE: code:18 = key 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10 # NOTE: code:19 = key 0
bind = $mainMod SHIFT, bracketleft, movetoworkspace, -1 # brackets [
bind = $mainMod SHIFT, bracketright, movetoworkspace, +1 # brackets ]

# Move active window to a workspace silently mainMod + CTRL [0-9]
bind = $mainMod CTRL, code:10, movetoworkspacesilent, 1 # NOTE: code:10 = key 1
bind = $mainMod CTRL, code:11, movetoworkspacesilent, 2 # NOTE: code:11 = key 2
bind = $mainMod CTRL, code:12, movetoworkspacesilent, 3 # NOTE: code:12 = key 3
bind = $mainMod CTRL, code:13, movetoworkspacesilent, 4 # NOTE: code:13 = key 4
bind = $mainMod CTRL, code:14, movetoworkspacesilent, 5 # NOTE: code:14 = key 5
bind = $mainMod CTRL, code:15, movetoworkspacesilent, 6 # NOTE: code:15 = key 6
bind = $mainMod CTRL, code:16, movetoworkspacesilent, 7 # NOTE: code:16 = key 7
bind = $mainMod CTRL, code:17, movetoworkspacesilent, 8 # NOTE: code:17 = key 8
bind = $mainMod CTRL, code:18, movetoworkspacesilent, 9 # NOTE: code:18 = key 9
bind = $mainMod CTRL, code:19, movetoworkspacesilent, 10 # NOTE: code:19 = key 0
bind = $mainMod CTRL, bracketleft, movetoworkspacesilent, -1 # brackets [
bind = $mainMod CTRL, bracketright, movetoworkspacesilent, +1 # brackets ]

# Switch workspaces with mainMod + homerow keys (qweasdzxc = 3x3 grid)
bind = $mainMod, Q, workspace, 1
bind = $mainMod, W, workspace, 2
bind = $mainMod, E, workspace, 3
bind = $mainMod, A, workspace, 4
bind = $mainMod, S, workspace, 5
bind = $mainMod, D, workspace, 6
bind = $mainMod, Z, workspace, 7
bind = $mainMod, X, workspace, 8
bind = $mainMod, C, workspace, 9

# Move active window and follow to workspace mainMod + SHIFT + homerow keys
bind = $mainMod SHIFT, Q, movetoworkspace, 1
bind = $mainMod SHIFT, W, movetoworkspace, 2
bind = $mainMod SHIFT, E, movetoworkspace, 3
bind = $mainMod SHIFT, A, movetoworkspace, 4
bind = $mainMod SHIFT, S, movetoworkspace, 5
bind = $mainMod SHIFT, D, movetoworkspace, 6
bind = $mainMod SHIFT, Z, movetoworkspace, 7
bind = $mainMod SHIFT, X, movetoworkspace, 8
bind = $mainMod SHIFT, C, movetoworkspace, 9

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, period, workspace, e+1
bind = $mainMod, comma, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow # NOTE: mouse:272 = left click
bindm = $mainMod, mouse:273, resizewindow # NOTE: mouse:273 = right click

bind = $mainMod, I, exec, pkill -SIGUSR1 waybar

# USER ####################
$RofiDir=$HOME/.config/rofi
bind = ALT SHIFT, D, exec, pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window -theme "$RofiDir"/themes/launcher.rasi -drun-display-format "{name}" -display-drun ""
bind = $mainMod, O, exec, pkill rofi || true && $RofiDir/bin/vim
bind = $mainMod, Return, exec, $term  #terminal
# bind = $mainMod, E, exec, $files #file manager
# bind = $mainMod, B, exec, xdg-open "https://"  # default browser
# bind = $mainMod, A, global, quickshell:overviewToggle # desktop overview (if installed)


# FEATURES / EXTRAS
bind = ALT SHIFT, S, exec, ~/work/custom/ssh-menu/ssh_menu.sh
bind = $mainMod ALT, D, exec, $scriptsDir/RofiEmoji.sh # emoji menu
bind = $mainMod ALT, V, exec, $scriptsDir/ClipManager.sh # Clipboard Manager
# bind = $mainMod, W, exec, $scriptsDir/WallpaperSelect.sh # Select wallpaper to apply
#bind = $mainMod CTRL SHIFT, R, exec, pkill rofi || true && $scriptsDir/RofiThemeSelector-modified.sh # modified Rofi Theme Selector
#bind = $mainMod, R, exec, $scriptsDir/Refresh.sh # Refresh waybar, swaync, rofi
#bind = $mainMod, SHIFT, S, exec, $scriptsDir/RofiSearch.sh # Google search using rofi
#bind = $mainMod SHIFT, G, exec, $scriptsDir/GameMode.sh # Toggle animations ON/OFF

# Desktop zooming or magnifier
bind = $mainMod ALT, mouse_down, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 1.5}')"
bind = $mainMod ALT, mouse_up, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 1.5}')" 
binde = $mainMod, mouse_down,  exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
binde = $mainMod, KP_ADD,      exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
binde = $mainMod, mouse_up,    exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')
binde = $mainMod, KP_SUBTRACT, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')
bind  = $mainMod, mouse:274,   exec, hyprctl -q keyword cursor:zoom_factor 1




##################################################################################
# WINDOW RULES ###################################################################
##################################################################################

# browser tags
windowrule = tag browser, match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$
windowrule = tag browser, match:class ^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$
windowrule = tag browser, match:class ^(chrome-.+-Default)$ # Chrome PWAs
windowrule = tag browser, match:class ^([Cc]hromium)$
windowrule = tag browser, match:class ^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable))$
windowrule = tag browser, match:class ^(Brave-browser(-beta|-dev|-unstable)?)$
windowrule = tag browser, match:class ^([Tt]horium-browser|[Cc]achy-browser)$
windowrule = tag browser, match:class ^(zen-alpha|zen)$

# notif tags
windowrule = tag notif, match:class ^(swaync-control-center|swaync-notification-window|swaync-client|class)$

# terminal tags
windowrule = tag terminal, match:class ^(Alacritty|kitty|kitty-dropterm)$

# email tags
windowrule = tag email, match:class ^([Tt]hunderbird|org.gnome.Evolution)$
windowrule = tag email, match:class ^(eu.betterbird.Betterbird)$

# project tags
windowrule = tag projects, match:class ^(codium|codium-url-handler|VSCodium)$
windowrule = tag projects, match:class ^(VSCode|code-url-handler)$
windowrule = tag projects, match:class ^(jetbrains-.+)$ # JetBrains IDEs

# screenshare tags
windowrule = tag screenshare, match:class ^(com.obsproject.Studio)$

# IM tags
windowrule = tag im, match:class ^([Dd]iscord|[Ww]ebCord|[Vv]esktop)$
windowrule = tag im, size (monitor_w*0.6) (monitor_h*0.7), match:class ^([Ff]erdium)$
windowrule = tag im, match:class ^([Ww]hatsapp-for-linux)$
windowrule = tag im, match:class ^(ZapZap|com.rtosta.zapzap)$
windowrule = tag im, match:class ^(org.telegram.desktop|io.github.tdesktop_x64.TDesktop)$
windowrule = tag im, match:class ^(teams-for-linux)$
windowrule = tag im, match:class ^(im.riot.Riot|Element)$ # Element Matrix client

# game tags
windowrule = tag games, match:class ^(gamescope)$
windowrule = tag games, match:class ^(steam_app_\d+)$

# gamestore tags
windowrule = tag gamestore, match:class ^([Ss]team)$
windowrule = tag gamestore, match:title ^([Ll]utris)$
windowrule = tag gamestore, match:class ^(com.heroicgameslauncher.hgl)$

# file-manager tags
windowrule = tag file-manager, match:class ^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt)$
windowrule = tag file-manager, match:class ^(app.drey.Warp)$

# wallpaper tags
windowrule = tag wallpaper, match:class ^([Ww]aytrogen)$

# multimedia tags
windowrule = tag multimedia, match:class ^([Aa]udacious)$

# multimedia-video tags
windowrule = tag multimedia_video, match:class ^([Mm]pv|vlc)$

# settings tags
windowrule = tag settings, match:title ^(ROG Control)$
windowrule = tag settings, match:class ^(wihotspot(-gui)?)$ # wifi hotspot
windowrule = tag settings, match:class ^([Bb]aobab|org.gnome.[Bb]aobab)$ # Disk usage analyzer
windowrule = tag settings, match:class ^(gnome-disks|wihotspot(-gui)?)$
windowrule = tag settings, match:title (Kvantum Manager)
windowrule = tag settings, match:class ^(file-roller|org.gnome.FileRoller)$ # archive manager
windowrule = tag settings, match:class ^(nm-applet|nm-connection-editor|blueman-manager)$
windowrule = tag settings, center on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = tag settings, match:class ^(qt5ct|qt6ct|[Yy]ad)$
windowrule = tag settings, match:class (xdg-desktop-portal-gtk)
windowrule = tag settings, match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = tag settings, match:class ^([Rr]ofi)$

# viewer tags
windowrule = tag viewer, match:class ^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter)$ # system monitor
windowrule = tag viewer, match:class ^(evince)$ # document viewer
windowrule = tag viewer, match:class ^(eog|org.gnome.Loupe)$ # image viewer

# POSITION
# windowrulev2 = center, floating:1
# Logic: Class is Thunar AND Title is NOT Thunar
windowrule = center on, float on, match:class ([Tt]hunar), match:title ^(?!.*[Tt]hunar).*$
windowrule = center on, match:title ^(Keybindings)$
#windowrulev2 = move 72% 7%, title:^(Firefox)$ 

# windowrule to avoid idle for fullscreen apps
windowrule = idle_inhibit fullscreen, match:fullscreen 1

# windowrule move to workspace
# windowrulev2 = workspace 1, tag:email*
# windowrulev2 = workspace 2, tag:browser*

# FLOAT
windowrule = float on, size (monitor_w*0.7) (monitor_h*0.7), match:tag wallpaper*
windowrule = float on, size (monitor_w*0.7) (monitor_h*0.7), match:tag settings*
windowrule = float on, match:tag viewer*
windowrule = float on, match:class ([Zz]oom|onedriver|onedriver-launcher)$
windowrule = float on, match:class (org.gnome.Calculator), match:title (Calculator)
windowrule = float on, match:class ^(mpv|com.github.rafostar.Clapper)$
windowrule = float on, match:class ^([Qq]alculate-gtk)$
windowrule = float on, pin on, keep_aspect_ratio on, match:title ^(Picture-in-Picture)$

# windowrule - ######### float popups and dialogue #######
windowrule = float on, center on, match:title ^(Authentication Required)$

# Negative lookahead regex conversion:
windowrule = float on, match:class (codium|codium-url-handler|VSCodium), match:title ^(?!.*codium|.*VSCodium).*$
windowrule = float on, match:class ^(com.heroicgameslauncher.hgl)$, match:title ^(?!Heroic Games Launcher).*$
windowrule = float on, match:class ^([Ss]team)$, match:title ^(?!^([Ss]team)$).*$

windowrule = float on, size (monitor_w*0.7) (monitor_h*0.6), center on, match:title ^(Add Folder to Workspace)$

windowrule = float on, size (monitor_w*0.7) (monitor_h*0.6), center on, match:title ^(Save As)$

windowrule = float on, size (monitor_w*0.4) (monitor_h*0.6), center on, match:title ^(floating)$

windowrule = float on, size (monitor_w*0.7) (monitor_h*0.6), match:initial_title (Open Files)

# SIZE
windowrule = size (monitor_w*0.6) (monitor_h*0.7), match:class ^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$

# PINNING

# windowrule - extras

# BLUR & FULLSCREEN
windowrule = no_blur on, float on, match:tag games*

#windowrule = border_size 1, match:tag terminal*
windowrule = border_size 2, match:workspace special:terminal

# LAYER RULES
# Layer rules usually don't use v2 syntax yet, but follow rule, namespace
layerrule = blur on, ignore_alpha 0, match:namespace rofi
layerrule = blur on, ignore_alpha 0, match:namespace waybar
layerrule = blur on, ignore_alpha 0, match:namespace notifications
#layerrule = blur on, ignore_alpha 0, match:namespace swaync-control-center
layerrule = blur on, ignore_alpha 0, match:namespace swaync-notification-window
layerrule {
  name = noctalia
  match:namespace = noctalia.*$
  ignore_alpha = 0.5
  blur = true
  blur_popups = true
}
