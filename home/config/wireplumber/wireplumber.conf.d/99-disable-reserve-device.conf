# Disables WirePlumber's D-Bus device-reservation negotiation
# (org.freedesktop.ReserveDevice1), which exists to coordinate exclusive
# ALSA device access with JACK. On this machine (Intel SOF/HDA, no JACK in
# use) it gets stuck in a release/re-acquire retry loop on startup, which
# crashes the ALSA monitor's node-creation callback (alsa.lua) before any
# sink/source ever gets created -- only the "Dummy Output" shows up.
# Disabling it lets the ALSA monitor create device nodes directly.
wireplumber.profiles = {
  main = {
    support.reserve-device = disabled
    monitor.alsa.reserve-device = disabled
  }
}
