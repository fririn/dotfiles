
[main]
font=FantasqueSansM Nerd Font Mono:size=14
pad=5x1

[scrollback]
# kitty: scrollback_lines 100000
lines=100000

[bell]
urgent=no
notify=no
visual=no

[colors-dark]
# kitty: foreground #dddddd / background #000000
foreground=dddddd
background=000000
# kitty: selection_foreground none / selection_background none
# (kitty "none" = reverse video; foot does this by default when unset)

# kitty: cursor #dddddd (foot needs both the under-cursor text color and
# the cursor color itself)
cursor=000000 dddddd

# kitty: background_opacity 1 / dynamic_background_opacity 1
alpha=1.0

# kitty.conf never overrides color0-15, so it was silently using kitty's own
# built-in ANSI palette - not foot's. foot's defaults differ enough that
# blue-on-green (e.g. `ls` coloring for 777 dirs) is nearly unreadable: foot's
# blue #24acd4 and green #47b413 have almost identical brightness, while
# kitty's blue #0d73cc is much darker than its green #19cb00. Pulled these
# from kitty's options/definition.py to match kitty's actual defaults.
regular0=000000
regular1=cc0403
regular2=19cb00
regular3=cecb00
regular4=0d73cc
regular5=cb1ed1
regular6=0dcdcd
regular7=dddddd
bright0=767676
bright1=f2201f
bright2=23fd00
bright3=fffd00
bright4=1a8fff
bright5=fd28ff
bright6=14ffff
bright7=ffffff
