[mgr]
ratio          = [ 1, 3, 4 ]
linemode       = "size_and_perm"
show_hidden    = false
show_symlink   = true
scrolloff      = 15

[preview]
max_width       = 9000
max_height      = 9000

[[plugin.prepend_fetchers]]
id  = "git"
url = "*"
run = "git"

[[plugin.prepend_fetchers]]
id  = "git"
url = "*/"
run = "git"
