config_version = 2

[audio]
enable_overdrive = true

[bar.default]
end = [ "tray", "clipboard", "network", "bluetooth", "volume", "battery", "notifications" ]
font_weight = 700
margin_edge = 1
margin_ends = 0
margin_opposite_edge = 1
padding = 10
radius = 1
reserve_space = false
scale = 0.90000000596046448
shadow = false
show_on_workspace_switch = false
smart_auto_hide = true
start = [ "workspaces", "cpu", "sysmon" ]
thickness = 26
widget_spacing = 8

[calendar]
enabled = true
refresh_minutes = 5

    [calendar.account.getblock]
    color = "tertiary"
    name = "GetBlock"
    type = "google"

[desktop_widgets]
enabled = false

[location]
address = "Batumi, Georgia"

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 1280.0
    cy = 1317.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 957.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 1077.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[notification]
background_opacity = 1
layer = "overlay"
scale = 1.1000000089406967

[plugins]
enabled = [ "gustav0ar/drive-health" ]

[shell]
password_style = "random"
screen_time_enabled = true
settings_show_advanced = true

    [shell.panel]
    clipboard_placement = "attached"

[system.monitor]
cpu_poll_seconds = 1
disk_poll_seconds = 60
gpu_poll_seconds = 5
memory_poll_seconds = 5

[theme]
builtin = "Ayu"
community_palette = "Mine"
mode = "dark"

